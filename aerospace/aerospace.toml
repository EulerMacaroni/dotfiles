after-login-command = []

after-startup-command = []

# exec-on-workspace-change = [
#     '/bin/bash',
#     '-c',
#     '/opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
# ]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = "move-mouse window-lazy-center"
automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

# [gaps]
#     inner.horizontal = 0
#     inner.vertical =   0
#     outer.left =       0
#     outer.bottom =     0
#     outer.top =       32
#     outer.right =      0
[gaps]
  inner.horizontal = 6
  inner.vertical = 8
  outer.top = 2
  outer.left = 10
  outer.bottom = 18
  outer.right = 10
[mode.main.binding]

    # alt-r = 'mode resize'

    alt-enter = 'exec-and-forget open -b info.sioyek.sioyek'

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-a = 'workspace A'
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-f = 'workspace F'
    alt-g = 'workspace G'
    alt-i = 'workspace I'
    alt-m = 'workspace M'
    alt-n = 'workspace N'
    alt-o = 'workspace O'
    alt-p = 'workspace P'
    alt-q = 'workspace Q'
    # alt-r = 'workspace R' for resize
    alt-s = 'workspace S'
    alt-t = 'workspace T'
    alt-u = 'workspace U'
    alt-v = 'workspace V'
    alt-w = 'workspace W'
    alt-x = 'workspace X'
    alt-y = 'workspace Y'
    alt-z = 'workspace Z'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-e = 'move-node-to-workspace E'
    alt-shift-f = 'move-node-to-workspace F'
    alt-shift-g = 'move-node-to-workspace G'
    alt-shift-i = 'move-node-to-workspace I'
    alt-shift-m = 'move-node-to-workspace M'
    alt-shift-n = 'move-node-to-workspace N'
    alt-shift-o = 'move-node-to-workspace O'
    alt-shift-p = 'move-node-to-workspace P'
    alt-shift-q = 'move-node-to-workspace Q'
    # alt-shift-r = 'move-node-to-workspace R' for resize
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-t = 'move-node-to-workspace T'
    alt-shift-u = 'move-node-to-workspace U'
    alt-shift-v = 'move-node-to-workspace V'
    alt-shift-w = 'move-node-to-workspace W'
    alt-shift-x = 'move-node-to-workspace X'
    alt-shift-y = 'move-node-to-workspace Y'
    alt-shift-z = 'move-node-to-workspace Z'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

# [mode.resize.binding]
#     minus = 'resize smart -50'
#     equal = 'resize smart +50'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    # r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# Terminal on workspace T
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = "move-node-to-workspace T"

# browser(s) on workspace B
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = "move-node-to-workspace B"

# finder on F
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = "move-node-to-workspace F"


# move all the chat windows to workspace M
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = "move-node-to-workspace M"

# [[on-window-detected]]
# if.app-id = 'com.apple.MobileSMS'
# run = "move-node-to-workspace M"

# [[on-window-detected]]
# if.app-id = 'com.hnc.Discord'
# run = "move-node-to-workspace M"

# spotify on workspace S
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = "move-node-to-workspace S"

# Notes on workspace N
[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = "move-node-to-workspace N"


# Outlook on workspace O
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = "move-node-to-workspace O"

# Teams also on workspace O
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = "move-node-to-workspace O"

# pdf viewer (sioyek) on E
[[on-window-detected]]
if.app-id = 'info.sioyek.sioyek'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-name-regex-substring = 'sioyek'
run = 'move-node-to-workspace E'

# ghostty bug(https://ghostty.org/docs/help/macos-tiling-wms)
[[on-window-detected]]
if.app-id="com.mitchellh.ghostty"
run= [
  "layout floating",
]

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = "move-node-to-workspace T"

# cisco
[[on-window-detected]]
if.app-id ='com.cisco.secureclient.gui'
run = "move-node-to-workspace 9"

[[on-window-detected]]
if.app-id ='com.cisco.secureclient.gui'
run = "layout floating"
